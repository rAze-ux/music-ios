workflows:
  unsigned-ipa:
    name: Build unsigned IPA
    max_build_duration: 30
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Xcode project
        script: xcodegen generate
      - name: Archive (unsigned)
        script: |
          set -e
          xcodebuild archive \
            -project MusicApp.xcodeproj \
            -scheme MusicApp \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/MusicApp.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Pack unsigned IPA
        script: |
          set -e
          mkdir -p build/Payload
          cp -R build/MusicApp.xcarchive/Products/Applications/MusicApp.app build/Payload/
          cd build && zip -qry MusicApp-unsigned.ipa Payload
    artifacts:
      - build/MusicApp-unsigned.ipa
